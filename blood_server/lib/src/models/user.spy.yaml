class: User
serverOnly: true
table: app_user
fields:
  # Nullable so account deletion can clear this unique identifier.
  phoneE164: String?
  phoneHmac: String?
  imageKey: String?
  name: String
  # Links the app account to Serverpod authentication without exposing it in DTOs.
  authUserId: UuidValue?
  tierId: int, relation(parent=tier, onDelete=Restrict)
  donorPromptPending: bool, defaultModel=false, defaultPersist=false
  lastDonorPromptAt: DateTime?
  boundInstallId: UuidValue?
  language: Language, defaultModel=bn, defaultPersist=bn
  status: UserStatus, defaultModel=active, defaultPersist=active
  suspendedReason: String?
  createdAt: DateTime, defaultModel=now, defaultPersist=now
  updatedAt: DateTime, defaultModel=now, defaultPersist=now
  lastSeenAt: DateTime?
  deletedAt: DateTime?
indexes:
  app_user_phone_e164:
    fields: phoneE164
    unique: true
  app_user_status:
    fields: status
  app_user_tier_id:
    fields: tierId
  