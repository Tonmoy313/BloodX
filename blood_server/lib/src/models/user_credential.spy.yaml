class: UserCredential
serverOnly: true
table: user_credential
fields:
  user: User?, relation( onDelete=Cascade)
  pinHash: String
  failedAttempts: int, defaultModel=0, defaultPersist=0
  lockedUntil: DateTime?
  pinChangedAt: DateTime, defaultModel=now, defaultPersist=now
  updatedAt: DateTime, defaultModel=now, defaultPersist=now
indexes:
  user_credential_user_id:
    fields: userId
    unique: true
