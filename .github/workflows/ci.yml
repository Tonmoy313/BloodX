name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # gitleaks-action lists the pull request commits to scan them, which needs
  # read access to pull requests. Without this the job fails with a 403
  # "Resource not accessible by integration" instead of reporting leaks.
  pull-requests: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Free for personal accounts; organization accounts may need a license key.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(P[0-7]-[0-9]+|docs|chore|ci|fix)[: ]' || {
            echo "PR title must start with a task ID (P2-04) or docs: / chore: / ci: / fix:"; exit 1; }

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Guards, format, analyze
        run: bash scripts/check.sh
      - name: Tests
        run: bash scripts/test.sh
