name: deploy-staging

# Does nothing until the repo variable DEPLOY_ENABLED is 'true' (set during P0-4).
# Uses keyless auth (Workload Identity Federation); no JSON key in the repo.
# TODO in P0-4: pass secrets with --set-secrets, decide the migration policy, verify flag names against current gcloud docs.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy to Cloud Run (staging)
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}-staging" \
            --project "${{ vars.GCP_PROJECT }}" \
            --region "${{ vars.GCP_REGION }}" \
            --source blood_server \
            --min-instances 1 --max-instances 5 \
            --no-cpu-throttling
